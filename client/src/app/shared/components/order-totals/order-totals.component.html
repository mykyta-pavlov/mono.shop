<table class="basket__table" *ngIf="(basketTotal$ | async) as totals">
    <tbody>
        <tr>
            <td>Сума:</td>
            <td>{{totals.subtotal | currency}}</td>
        </tr>
        <tr>
            <td>Вартість доставки:</td>
            <td>{{totals.shipping | currency}}</td>
        </tr>
        <tr>
            <td>Загалом:</td>
            <td>{{totals.total | currency}}</td>
        </tr>
    </tbody>
</table>
